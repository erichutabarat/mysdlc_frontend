name: Notify Root on Push

on:
  push:
    branches: [main]

jobs:
  notify:
    name: Trigger root deployment
    runs-on: ubuntu-latest

    steps:
      - name: Send dispatch to root repo
        uses: peter-evans/repository-dispatch@v3
        with:
          token: ${{ secrets.ROOT_DISPATCH_TOKEN }}
          repository: erichutabarat/mysdlc   # <── change this
          event-type: frontend-updated
          client-payload: |
            {
              "service": "frontend",
              "sha": "${{ github.sha }}",
              "ref": "${{ github.ref }}",
              "actor": "${{ github.actor }}"
            }